<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Progreso · forScore</title>
<style>
  :root{
    color-scheme: light;
    --bg:         #ffffff;
    --card:       #ffffff;
    --card-2:     #f1f3f5;
    --track:      #eceef1;
    --text:       #111318;
    --secondary:  #4b5563;
    --muted:      #8a8f98;
    --border:     #e6e7eb;
    /* un color por meta */
    --m-ensayo:   #1a7f4b;  /* verde oscuro */
    --m-estudio:  #43c46f;  /* verde claro  */
    --m-acordeon: #2a78d6;  /* azul         */
    --m-guitarra: #e0752e;  /* naranja      */
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{min-height:100vh;padding:clamp(18px,2.4vw,44px);}

  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(18px,2.2vw,36px);}
  .brand{display:flex;align-items:baseline;gap:14px;}
  .brand h1{font-size:clamp(21px,2vw,32px);font-weight:700;margin:0;letter-spacing:-0.02em;}
  .brand .sub{color:var(--muted);font-size:clamp(12px,1vw,15px);}
  .clock{text-align:right;line-height:1.15;}
  .clock .time{font-size:clamp(20px,2vw,30px);font-weight:700;font-variant-numeric:tabular-nums;}
  .clock .date{color:var(--muted);font-size:clamp(11px,0.9vw,14px);text-transform:capitalize;}

  .rings{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,1.4vw,26px);}
  .rings-row{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(14px,1.4vw,26px);width:100%;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:clamp(18px,1.6vw,28px);
        width:clamp(220px,22vw,300px);
        display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(17,19,24,0.05);}
  .period-chip{font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);background:var(--card-2);border-radius:999px;padding:4px 11px;}
  .ring-wrap{position:relative;width:clamp(140px,11vw,190px);aspect-ratio:1;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .ring-center .val{font-size:clamp(19px,1.6vw,26px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
  .ring-center .pct{font-size:clamp(12px,0.95vw,14px);color:var(--muted);font-variant-numeric:tabular-nums;}
  .meta-name{font-size:clamp(15px,1.2vw,18px);font-weight:700;text-align:center;}
  .meta-sub{font-size:clamp(12px,0.9vw,14px);color:var(--secondary);text-align:center;}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Progreso Semanal · forScore</h1>
    <span class="sub">Tablero de mandos</span>
  </div>
  <div class="clock">
    <div class="time" id="clock-time">--:--</div>
    <div class="date" id="clock-date">—</div>
  </div>
</header>

<section class="rings" id="rings"></section>

<script>
"use strict";

const GOALS = [
  {id:"ensayo",   name:"PIANO · Ensayo",  row:1, target:3*3600, color:"var(--m-ensayo)"},
  {id:"estudio",  name:"PIANO · Estudio", row:1, target:3*3600, color:"var(--m-estudio)"},
  {id:"acordeon", name:"ACORDEÓN",        row:2, target:3*3600, color:"var(--m-acordeon)"},
  {id:"guitarra", name:"GUITARRA",        row:2, target:3*3600, color:"var(--m-guitarra)"},
];

/* datos iniciales (captura del 14/08/2026) */
const SEED = [
  {date:"2026-08-14", ensayo:1*3600+31*60+46, estudio:2*3600+15*60+7, acordeon:37*60+36, guitarra:50*60+1}
];
const STORE_KEY = "forscore_progress_v3";

let memFallback = null;
function loadData(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }
  catch(e){ if(memFallback) return memFallback; }
  return JSON.parse(JSON.stringify(SEED));
}
function saveData(d){ memFallback=d; try{ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }catch(e){} }
let DATA = loadData();

/* utilidades de tiempo */
function parseTime(str){
  if(str==null) return null; str=String(str).trim(); if(str==="") return null;
  if(/^\d+$/.test(str)) return parseInt(str,10);
  const p=str.split(":").map(x=>parseInt(x,10)); if(p.some(isNaN)) return null;
  if(p.length===2) return p[0]*60+p[1];
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  return null;
}
function fmtTime(sec){
  if(sec==null) return "—"; sec=Math.round(sec);
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  const pad=n=>String(n).padStart(2,"0");
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function fmtTarget(sec){
  if(sec%3600===0) return (sec/3600)+"h";
  if(sec%60===0)   return (sec/60)+" min";
  return fmtTime(sec);
}

function latestEntry(){ return DATA.length ? DATA.slice().sort((a,b)=>a.date<b.date?1:-1)[0] : null; }

function cardHTML(g,cur){
  const val=cur?(cur[g.id]??0):0;
  const pct=g.target>0?val/g.target:0;
  const pctC=Math.max(0,Math.min(1,pct));
  const R=54, C=2*Math.PI*R, off=C*(1-pctC);
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--track)" stroke-width="11"/>
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="${g.color}" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      </svg>
      <div class="ring-center">
        <span class="val">${fmtTime(val)}</span>
        <span class="pct">${Math.round(pct*100)}%</span>
      </div>
    </div>
    <div class="meta-name">${g.name}</div>
    <div class="meta-sub">Objetivo ${fmtTarget(g.target)}</div>`;
  return card;
}
function renderRings(){
  const wrap=document.getElementById("rings"); const cur=latestEntry(); wrap.innerHTML="";
  const rows=[...new Set(GOALS.map(g=>g.row))].sort();
  rows.forEach(r=>{
    const rowEl=document.createElement("div"); rowEl.className="rings-row";
    GOALS.filter(g=>g.row===r).forEach(g=>rowEl.appendChild(cardHTML(g,cur)));
    wrap.appendChild(rowEl);
  });
}

/* inyección por URL para el futuro Atajo: #add=FECHA,ensayo,estudio,acordeon,guitarra */
function handleHash(){
  const h=location.hash; if(!h.startsWith("#add=")) return;
  const parts=decodeURIComponent(h.slice(5)).split(",").map(s=>s.trim());
  const entry={date:parts[0]||new Date().toISOString().slice(0,10)};
  GOALS.forEach((g,i)=>{const v=parseTime(parts[i+1]); if(v!=null) entry[g.id]=v;});
  const idx=DATA.findIndex(e=>e.date===entry.date);
  if(idx>=0) DATA[idx]=Object.assign({},DATA[idx],entry); else DATA.push(entry);
  saveData(DATA); history.replaceState(null,"",location.pathname+location.search); renderRings();
}

function tickClock(){
  const t=new Date(); const p=n=>String(n).padStart(2,"0");
  document.getElementById("clock-time").textContent=`${p(t.getHours())}:${p(t.getMinutes())}`;
  document.getElementById("clock-date").textContent=t.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
}

handleHash();
window.addEventListener("hashchange",handleHash);
renderRings();
tickClock(); setInterval(tickClock,15000);
</script>
</body>
</html>
