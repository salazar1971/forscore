<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progreso · forScore</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#ffffff;color:#8a8f98;
            font-family:Helvetica,Arial,sans-serif;}
  .c{position:absolute;top:44%;left:0;right:0;text-align:center;font-size:14px;}
  .c a{color:#2a78d6;text-decoration:none;display:inline-block;margin:8px 10px;}
</style>
</head>
<body>
<div class="c" id="c">Cargando…</div>

<script>
/* ============================================================
   Lanzador. Este archivo NO se toca nunca más, así que da igual
   que el navegador lo guarde en su caché: siempre dice lo mismo.
   Su único trabajo es abrir la página de verdad añadiéndole una
   marca de tiempo, de forma que para el navegador sea siempre una
   dirección nueva y no pueda servir una copia vieja.

     /forscore/            -> panel.html   (panel diario)
     /forscore/?p=bn       -> bn.html      (blanco y negro, Kindle)
     /forscore/?p=mes      -> mes.html     (resumen mensual)

   Cualquier otro parámetro se pasa tal cual, y también el #hash.
   ============================================================ */
(function(){
  "use strict";

  var PAGINAS = { panel:"panel.html", bn:"bn.html", mes:"mes.html" };

  var busca = location.search.replace(/^\?/, "");
  var partes = busca ? busca.split("&") : [];
  var destino = "panel", resto = [], i, kv;

  for (i = 0; i < partes.length; i++){
    kv = partes[i].split("=");
    if (kv[0] === "p"){
      if (PAGINAS[kv[1]]) destino = kv[1];
    } else if (partes[i] !== ""){
      resto.push(partes[i]);           /* p. ej. mes=2026-07 */
    }
  }

  var url = PAGINAS[destino] + "?t=" + (new Date()).getTime();
  if (resto.length) url += "&" + resto.join("&");
  url += location.hash;                /* conserva #reset, #add=... */

  /* replace y no assign: así el botón Atrás no vuelve aquí y
     se queda en bucle */
  if (location.replace) location.replace(url);
  else location.href = url;

  /* por si el navegador no ejecuta scripts o algo falla */
  setTimeout(function(){
    document.getElementById("c").innerHTML =
      'Si no se abre solo:<br>' +
      '<a href="panel.html">Panel diario</a>' +
      '<a href="bn.html">Blanco y negro</a>' +
      '<a href="mes.html">Resumen mensual</a>';
  }, 2500);
})();
</script>

<noscript>
  <div class="c">
    <a href="panel.html">Panel diario</a>
    <a href="bn.html">Blanco y negro</a>
    <a href="mes.html">Resumen mensual</a>
  </div>
</noscript>
</body>
</html>
