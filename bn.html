<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progreso Semanal · blanco y negro</title>
<style>
  /* Pensado para tinta electrónica: sin color, contraste alto, trazos gruesos.
     Maquetación y código conservadores para que también los entiendan
     los navegadores antiguos (como el del Kindle). */
  html, body { margin:0; padding:0; background:#ffffff; color:#000000; }
  body { font-family: Helvetica, Arial, sans-serif; -webkit-text-size-adjust:100%; }
  .wrap { padding: 12px 16px; }

  .head { border-bottom: 3px solid #000; padding-bottom: 7px; margin-bottom: 12px; }
  .head h1 { margin:0; font-size:25px; font-weight:bold; display:inline-block; }
  .head .upd { float:right; font-size:13px; color:#555; padding-top:9px; }

  /* ---------- semana ---------- */
  .lbl { font-size:11px; letter-spacing:1.5px; color:#555; margin-bottom:6px; }
  .wcol { display:inline-block; vertical-align:middle; }
  .wcol-a { width:70%; }
  .wcol-b { width:29%; text-align:right; }

  .track { position:relative; }
  .line, .line-on { position:absolute; top:50%; margin-top:-2px; height:4px; }
  .line    { left:7.14%; right:7.14%; background:#c0c0c0; }
  .line-on { left:7.14%; background:#000000; }

  .dots { position:relative; font-size:0; white-space:nowrap; }
  .cell { display:inline-block; width:14.28%; text-align:center; vertical-align:middle; }
  .dot  { display:inline-block; border-radius:50%; box-sizing:border-box;
          background:#ffffff; color:#666666; border:3px solid #b8b8b8;
          font-family: Helvetica, Arial, sans-serif; font-weight:bold; }
  .dot.on  { background:#000000; color:#ffffff; border-color:#000000; }
  .dot.hoy { background:#000000; color:#ffffff; border-color:#000000; }

  .big { font-size:44px; font-weight:bold; line-height:1; letter-spacing:-1px; }
  .sub { font-size:15px; color:#333; margin-top:3px; }

  /* ---------- anillos ---------- */
  .rings { font-size:0; margin-top:14px; }
  .rcell { display:inline-block; width:50%; text-align:center; vertical-align:top; }
  .rbox  { position:relative; margin:0 auto; }
  .rbox svg { display:block; width:100%; height:100%; }
  .rmid  { position:absolute; left:0; top:0; width:100%; height:100%; display:table; }
  .rmid > div { display:table-cell; vertical-align:middle; text-align:center; }
  .val { font-size:32px; font-weight:bold; letter-spacing:-1px; line-height:1.05;
         font-family: Helvetica, Arial, sans-serif; }
  .pc  { font-size:15px; color:#444; font-family: Helvetica, Arial, sans-serif; }
  .name { font-size:17px; font-weight:bold; margin-top:5px;
          font-family: Helvetica, Arial, sans-serif; }
  .goal { font-size:13px; color:#444; margin-top:1px;
          font-family: Helvetica, Arial, sans-serif; }

  /* ---------- citas de la semana, en tabla de lunes a domingo ---------- */
  .evs { margin-top:8px; }
  table.wk { width:100%; border-collapse:collapse; table-layout:fixed; }
  table.wk td { border:1px solid #bbbbbb; vertical-align:top; padding:3px 4px; }
  table.wk td.we { background:#e7e7e7; }
  table.wk tr.dows td { border:0; text-align:center; padding:0 0 3px;
                        color:#555555; font-weight:normal; }
  table.wk tr.dows td.we { background:transparent; color:#8a8a8a; }
  .dhead { margin-bottom:3px; white-space:nowrap; }
  .dnum { font-weight:bold; color:#000; }
  .dnum.hoy { display:inline-block; background:#000000; color:#ffffff;
              border-radius:50%; text-align:center; }
  .ev { border-left:3px solid #000000; padding-left:4px; margin-top:2px;
        line-height:1.15; word-wrap:break-word; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Progreso Semanal</h1>
    <span class="upd" id="upd">&nbsp;</span>
  </div>

  <div class="lbl">ESTA SEMANA</div>
  <div>
    <div class="wcol wcol-a">
      <div class="track" id="track">
        <div class="line"></div>
        <div class="line-on" id="lineOn"></div>
        <div class="dots" id="dots"></div>
      </div>
    </div><div class="wcol wcol-b">
      <div class="big" id="pct">—</div>
      <div class="sub" id="tot">&nbsp;</div>
    </div>
  </div>

  <div class="rings" id="rings"></div>

  <div class="evs" id="evs"></div>

</div>

<script>
/* Escrito a la vieja usanza (sin funciones flecha ni plantillas de texto)
   para que también lo entiendan los navegadores antiguos. */
"use strict";

var GIST_ID = "67e43503e86392b72b6e17f0ad71e9c5";

var GOALS = [
  { id:"ensayo",   name:"PIANO · Ensayo",  target: 3*3600 },
  { id:"estudio",  name:"PIANO · Estudio", target: 3*3600 },
  { id:"acordeon", name:"ACORDEÓN",        target: 3*3600 },
  { id:"guitarra", name:"GUITARRA",             target: 3*3600 }
];
var LETRAS = ["L","M","X","J","V","S","D"];
var NOMBRES_DIA = ["lun","mar","mié","jue","vie","sáb","dom"];
var CLAVE = "forscore_bn_v1";

var datos = { ensayo:0, estudio:0, acordeon:0, guitarra:0 };
var citas = [];   /* [{d:"2026-08-15", t:"21:00", n:"..."}] */

/* ¿Tenemos algún dato de verdad, de la caché o de la descarga? Mientras no lo
   haya, los tiempos se muestran como "—" y no como "0:00". Importa para el
   TRMNL: su servidor abre la página desde cero, sin nada guardado, y un cero
   falso sería indistinguible de una semana sin tocar el piano. */
var hayDatos = false;

/* mientras arranca no se pinta a medias: se pinta una sola vez, al final */
var arrancando = true;

/* ---------- utilidades ---------- */
function pad2(n){ n = String(n); return n.length < 2 ? "0" + n : n; }

/* El OCR se come a veces los dos puntos: "13328" en vez de "1:33:28".
   Un número de 4 a 6 cifras se lee como (h)hmmss. Escrito a la vieja
   usanza porque el navegador del Kindle no entiende nada moderno. */
function sinDosPuntos(s){
  if (!/^\d{4,6}$/.test(s)) return null;
  var t = s;
  while (t.length < 6) t = "0" + t;
  var h = parseInt(t.substring(0,2), 10);
  var m = parseInt(t.substring(2,4), 10);
  var g = parseInt(t.substring(4,6), 10);
  if (m > 59 || g > 59) return null;
  return h*3600 + m*60 + g;
}
function parseTime(s){
  if (s === null || s === undefined) return null;
  s = String(s).replace(/^\s+|\s+$/g, "");
  if (s === "") return null;
  var rep = sinDosPuntos(s);
  if (rep !== null) return rep;
  var p = s.split(":"), n = [], i, v;
  for (i = 0; i < p.length; i++){
    v = parseInt(p[i], 10);
    if (isNaN(v)) return null;
    n.push(v);
  }
  if (n.length === 1) return n[0];
  if (n.length === 2) return n[0]*60 + n[1];
  if (n.length === 3) return n[0]*3600 + n[1]*60 + n[2];
  return null;
}
function fmtHM(sec){
  if (!hayDatos) return "—";
  sec = Math.floor(sec || 0);
  return Math.floor(sec/3600) + ":" + pad2(Math.floor((sec % 3600)/60));
}
/* los objetivos son constantes nuestras, se escriben siempre */
function fmtHMfijo(sec){
  sec = Math.floor(sec || 0);
  return Math.floor(sec/3600) + ":" + pad2(Math.floor((sec % 3600)/60));
}
function fmtObjetivo(sec){
  if (sec % 3600 === 0) return (sec/3600) + "h";
  return fmtHMfijo(sec);
}
function decode(s){
  var out = String(s).replace(/\+/g, " "), i, dec;
  for (i = 0; i < 3; i++){
    if (!/%[0-9A-Fa-f]{2}/.test(out)) break;
    try { dec = decodeURIComponent(out); } catch (e) { break; }
    if (dec === out) break;
    out = dec;
  }
  return out;
}

/* ---------- datos ---------- */
function aplicar(texto){
  if (!texto) return false;
  if (texto.indexOf("#") >= 0) texto = texto.substring(texto.indexOf("#") + 1);
  var hubo = false, i, v;

  /* tiempos */
  var m = /(?:^|&)add=([\s\S]*?)(?=&(?:add|cal)=|$)/i.exec(texto);
  if (m){
    var partes = decode(m[1]).split(",");
    for (i = 0; i < GOALS.length; i++){
      v = parseTime(partes[i+1]);
      if (v !== null){ datos[GOALS[i].id] = v; hubo = true; hayDatos = true; }
    }
  }

  /* citas */
  var c = /(?:^|&)cal=([\s\S]*?)(?=&(?:add|cal)=|$)/i.exec(texto);
  if (c){
    var trozos = decode(c[1]).split(";"), nuevas = [], f, d;
    for (i = 0; i < trozos.length; i++){
      f = trozos[i].replace(/^\s+|\s+$/g, "").split("|");
      d = (f[0] || "").replace(/^\s+|\s+$/g, "");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
      nuevas.push({
        d: d,
        t: (f[1] || "").replace(/^\s+|\s+$/g, ""),
        n: (f.slice(2).join("|") || "").replace(/^\s+|\s+$/g, "")
      });
    }
    if (nuevas.length){ citas = nuevas; hubo = true; }
  }

  if (hubo){
    try {
      localStorage.setItem(CLAVE, JSON.stringify({ t: datos, c: citas }));
    } catch (e) {}
  }
  return hubo;
}
function cargarGuardado(){
  try {
    var s = localStorage.getItem(CLAVE);
    if (!s) return;
    var o = JSON.parse(s);
    if (o && o.t){ datos = o.t; citas = o.c || []; hayDatos = true; }
    else if (o) { datos = o; hayDatos = true; }        /* formato antiguo */
  } catch (e) {}
}
var ultimoContenido = "";   /* para no repintar si no ha cambiado nada */
var ultimoIntento = 0;

var GIST_USER = "salazar1971";
var GIST_RAW  = "https://gist.githubusercontent.com/" + GIST_USER + "/" + GIST_ID + "/raw/datos.txt";

/* Qué ha pasado con la última descarga. Se enseña en la cabecera cuando no
   hay datos, para que el propio aparato cuente por qué está en blanco:
   "E0" = ni siquiera hubo respuesta (red cortada o CORS), "E404" = no está,
   "vacio" = respondió pero sin contenido, "pendiente" = aún no ha vuelto. */
var estadoRed = "pendiente";

/* La primera descarga se pide SÍNCRONA a propósito. El servidor de TRMNL
   fotografía la página en cuanto termina de cargar, y una petición normal
   (asíncrona) todavía va por el camino en ese momento: salía la pantalla con
   rayas. Una petición síncrona frena la carga hasta que los datos están
   dentro, así que la foto ya los pilla. Las siguientes son asíncronas. */
function pedir(url, alTerminar, sincrono){
  var x;
  try {
    x = new XMLHttpRequest();
    x.open("GET", url, !sincrono);
    if (sincrono){
      x.send(null);
      if (x.status === 200){ estadoRed = "ok"; alTerminar(x.responseText); }
      else { estadoRed = "E" + x.status; alTerminar(null); }
      return;
    }
    x.onreadystatechange = function(){
      if (x.readyState !== 4) return;
      if (x.status === 200){ estadoRed = "ok"; alTerminar(x.responseText); }
      else { estadoRed = "E" + x.status; alTerminar(null); }
    };
    x.send(null);
  } catch (e) { estadoRed = "E0"; alTerminar(null); }
}

function usarTexto(texto){
  if (!texto) return;
  /* si el contenido es idéntico, no se toca la pantalla:
     en tinta electrónica cada repintado cuesta y deja sombras */
  if (texto === ultimoContenido) return;
  ultimoContenido = texto;
  if (aplicar(texto) && !arrancando) pintar();
}

/* Primero el archivo en crudo, que NO gasta la cuota de la API de GitHub
   (60 peticiones por hora y por IP, compartida por todos los aparatos de
   casa). La API queda solo como reserva. */
function cargarGist(sincrono){
  if (!GIST_ID) return;
  pedir(GIST_RAW + "?t=" + (new Date()).getTime(), function(txt){
    if (txt && txt.replace(/\s/g, "") !== "") { usarTexto(txt); return; }
    if (estadoRed === "ok") estadoRed = "vacio";
    pedir("https://api.github.com/gists/" + GIST_ID + "?t=" + (new Date()).getTime(), function(t2){
      if (!t2) return;
      try {
        var j = JSON.parse(t2);
        var f = j.files && j.files["datos.txt"];
        if (f && f.content) usarTexto(f.content);
      } catch (e) { estadoRed = "json"; }
    }, sincrono);
  }, sincrono);
}

/* Se consulta al volver de la suspensión, al recuperar el foco o al tocar
   la pantalla, con un freno de 20 segundos para no repetir sin sentido. */
function refrescar(){
  var ahora = (new Date()).getTime();
  if (ahora - ultimoIntento < 20000) return;
  ultimoIntento = ahora;
  cargarGist(false);
}

function alEvento(obj, nombre, fn){
  if (obj.addEventListener) obj.addEventListener(nombre, fn, false);
  else if (obj.attachEvent) obj.attachEvent("on" + nombre, fn);
}

/* ---------- medidas según el alto de pantalla ---------- */
function medidas(){
  var h = (window.innerHeight || 600);
  if (h < 520)  return { dot:24, hoy:32, alto:34, anillo:74,  val:18, pc:10, nom:12, obj:10, big:28, pad:1, ev:9.5, celda:52 };
  if (h < 680)  return { dot:30, hoy:38, alto:44, anillo:104, val:23, pc:12, nom:14, obj:11, big:34, pad:3, ev:11, celda:62 };
  return              { dot:34, hoy:44, alto:50, anillo:124, val:27, pc:14, nom:15, obj:12, big:40, pad:5, ev:12, celda:74 };
}

/* ---------- dibujo ---------- */
function pintar(){
  var M = medidas(), i, total = 0, objetivo = 0;
  for (i = 0; i < GOALS.length; i++){
    total += datos[GOALS[i].id] || 0;
    objetivo += GOALS[i].target;
  }
  var pct = objetivo > 0 ? total / objetivo : 0;

  var elPct = document.getElementById("pct");
  elPct.style.fontSize = M.big + "px";
  elPct.innerHTML = hayDatos ? (Math.round(pct*100) + "%") : "—";
  document.getElementById("tot").innerHTML = fmtHM(total) + " de " + fmtObjetivo(objetivo);

  var ahora = new Date();
  var hoy = (ahora.getDay() + 6) % 7;
  document.getElementById("upd").innerHTML =
    "actualizado " + pad2(ahora.getHours()) + ":" + pad2(ahora.getMinutes()) +
    (hayDatos ? "" : " · sin datos (" + estadoRed + ")");

  /* --- días: 7 celdas iguales, el círculo centrado en cada una --- */
  document.getElementById("track").style.height = M.alto + "px";
  var html = "", d, tam;
  for (i = 0; i < 7; i++){
    d = "dot"; tam = M.dot;
    if (i < hoy) d += " on";
    if (i === hoy){ d += " hoy"; tam = M.hoy; }
    html += '<span class="cell"><span class="' + d + '" style="width:' + tam +
            'px;height:' + tam + 'px;line-height:' + (tam - 6) + 'px;font-size:' +
            Math.round(tam*0.42) + 'px">' + LETRAS[i] + '</span></span>';
  }
  document.getElementById("dots").innerHTML = html;
  /* la línea negra va del centro del primer círculo al centro del de hoy */
  document.getElementById("lineOn").style.width = (85.72 * (hoy/6)) + "%";

  /* --- anillos --- */
  var R = 52, C = 2 * Math.PI * R, s = "", g, val, p, off;
  for (i = 0; i < GOALS.length; i++){
    g = GOALS[i];
    val = datos[g.id] || 0;
    p = g.target > 0 ? val / g.target : 0;
    if (p > 1) p = 1;
    if (p < 0) p = 0;
    off = C * (1 - p);
    s += '<div class="rcell" style="padding-bottom:' + M.pad + 'px">' +
           '<div class="rbox" style="width:' + M.anillo + 'px;height:' + M.anillo + 'px">' +
             '<svg viewBox="0 0 120 120">' +
               '<g transform="rotate(-90 60 60)">' +
                 '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="#cccccc" stroke-width="14"/>' +
                 '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="#000000" stroke-width="14"' +
                        ' stroke-dasharray="' + C.toFixed(1) + '"' +
                        ' stroke-dashoffset="' + off.toFixed(1) + '"/>' +
               '</g>' +
             '</svg>' +
             '<div class="rmid"><div>' +
               '<div class="val" style="font-size:' + M.val + 'px">' + fmtHM(val) + '</div>' +
               '<div class="pc" style="font-size:' + M.pc + 'px">' +
                  (hayDatos ? Math.round((val/g.target)*100) + '%' : '') + '</div>' +
             '</div></div>' +
           '</div>' +
           '<div class="name" style="font-size:' + M.nom + 'px">' + g.name + '</div>' +
           '<div class="goal" style="font-size:' + M.obj + 'px">Objetivo ' +
                fmtObjetivo(g.target) + '</div>' +
         '</div>';
  }
  document.getElementById("rings").innerHTML = s;

  pintarCitas(M, ahora, hoy);
}

/* ---------- citas de la semana en curso (lunes a domingo) ---------- */
function claveFecha(f){
  return f.getFullYear() + "-" + pad2(f.getMonth()+1) + "-" + pad2(f.getDate());
}
function escapar(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function pintarCitas(M, ahora, hoy){
  var lunes = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() - hoy);
  var porDia = {}, i, j;
  for (i = 0; i < citas.length; i++){
    if (!porDia[citas[i].d]) porDia[citas[i].d] = [];
    porDia[citas[i].d].push(citas[i]);
  }

  var celdas = "", cabecera = "", circulo = Math.round((M.ev + 1) * 1.95);
  for (i = 0; i < 7; i++){
    cabecera += '<td class="' + (i >= 5 ? 'we' : '') + '" style="font-size:' +
                (M.ev - 0.5) + 'px">' + NOMBRES_DIA[i] + '</td>';
  }
  for (i = 0; i < 7; i++){
    var f = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + i);
    var lista = porDia[claveFecha(f)] || [];

    lista.sort(function(a, b){
      var at = a.t || "", bt = b.t || "";
      if (!at && bt) return -1;
      if (at && !bt) return 1;
      return at < bt ? -1 : (at > bt ? 1 : 0);
    });

    var dentro = '<div class="dhead">' +
                   '<span class="dnum' + (i === hoy ? ' hoy' : '') + '" style="font-size:' +
                      (M.ev + 1) + 'px' +
                      (i === hoy ? ';width:' + circulo + 'px;height:' + circulo +
                                   'px;line-height:' + circulo + 'px' : '') + '">' +
                      f.getDate() + '</span>' +
                 '</div>';

    for (j = 0; j < lista.length; j++){
      dentro += '<div class="ev" style="font-size:' + M.ev + 'px">' +
                   escapar(lista[j].n) + '</div>';
    }

    celdas += '<td class="' + (i >= 5 ? 'we' : '') + '" style="height:' +
              M.celda + 'px">' + dentro + '</td>';
  }

  document.getElementById("evs").innerHTML =
    '<table class="wk">' +
      '<tr class="dows">' + cabecera + '</tr>' +
      '<tr>' + celdas + '</tr>' +
    '</table>';
}

/* ---------- arranque ---------- */
cargarGuardado();
if (location.hash) aplicar(location.hash);
cargarGist(true);      /* síncrona: la foto del TRMNL no puede adelantarse */
arrancando = false;
pintar();
setInterval(function(){ cargarGist(false); }, 5*60*1000);

/* al despertar el aparato o volver a la página, comprobar en el acto */
alEvento(window, "focus", refrescar);
alEvento(window, "pageshow", refrescar);
alEvento(document, "touchstart", refrescar);
alEvento(document, "click", refrescar);
alEvento(document, "keydown", refrescar);
if (typeof document.addEventListener === "function"){
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) refrescar();
  }, false);
}
alEvento(window, "resize", pintar);
</script>
</body>
</html>
